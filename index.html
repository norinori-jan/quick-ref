<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クイック参照 – 統合版</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007AFF">

<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">読み込み中…</div>

<header>
  <div class="header-top">
    <h1>クイック参照</h1>
    <div class="header-actions">
      <span id="countLabel">0件</span>
      <button class="review-btn" id="reviewBtn">📋<span class="review-badge" id="reviewBadge"></span></button>
      <button class="icon-btn" id="lockToggleBtn">🔓</button>
      <button class="icon-btn" id="settingsBtn">⚙️</button>
      <button class="icon-btn" id="menuBtn">☰</button>
    </div>
  </div>

  <div class="search-row">
    <input id="searchInput" placeholder="検索…" autocomplete="off">
    <button id="searchClear">✕</button>
  </div>

  <div class="tag-filter-row" id="tagFilterRow"></div>
</header>

<div id="emptyState" style="display:none;padding:20px;color:#666;">項目がありません</div>
<div id="cardList"></div>

<!-- 編集シート -->
<div id="overlay"></div>
<div id="editSheet">
  <div class="sheet-header">
    <span id="sheetTitle">新規追加</span>
    <button id="cancelBtn">キャンセル</button>
    <button id="saveBtn">保存</button>
  </div>

  <div class="sheet-body">
    <input id="fTitle" placeholder="タイトル">
    <div id="fBody" contenteditable="true" class="memo-editor"></div>

    <div class="section">
      <label>タグ</label>
      <div id="tagChips"></div>
      <input id="tagInput" placeholder="タグ追加">
      <button id="tagAddBtn">追加</button>
      <div id="tagSuggestions"></div>
    </div>

    <div class="section">
      <label>URL</label>
      <input id="inputUrl" placeholder="https://">
      <button id="previewUrlBtn">開く</button>
    </div>

    <div class="section">
      <label>構造化項目</label>
      <div id="fieldRows"></div>
      <button id="addFieldBtn">＋項目追加</button>
    </div>

    <div class="section">
      <label>画像</label>
      <div id="imgThumbs"></div>
      <button id="imgPickBtn">写真を選択</button>
      <button id="imgCameraBtn">カメラ</button>
      <button id="imgSelfieBtn">自撮り</button>
      <button id="imgIllustBtn">IllustStudio</button>
      <input type="file" id="imgFileInput" accept="image/*" hidden>
      <input type="file" id="imgCameraInput" accept="image/*" capture="environment" hidden>
      <input type="file" id="imgSelfieInput" accept="image/*" capture="user" hidden>
    </div>

    <div class="section">
      <label>音声</label>
      <div id="audioList"></div>
      <button id="recStartBtn">録音開始</button>
      <button id="recStopBtn">停止</button>
      <div id="recStatus"><span id="recTimer">00:00</span></div>
    </div>

    <div class="section">
      <label>動画</label>
      <div id="videoList"></div>
      <button id="videoCamBtn">動画撮影</button>
      <button id="videoPickBtn">動画選択</button>
      <input type="file" id="videoCamInput" accept="video/*" capture="environment" hidden>
      <input type="file" id="videoFileInput" accept="video/*" hidden>
    </div>

    <div class="section">
      <label>保護</label>
      <input type="checkbox" id="sensitiveToggle"> パスコードで保護
    </div>

    <div id="dangerZone">
      <button id="deleteBtn" class="danger">削除</button>
    </div>

    <div id="relatedSection"></div>
  </div>
</div>

<!-- メモ全画面 -->
<div id="memoPopup">
  <div id="memoPopupHeader">
    <button id="memoPopupClose">閉じる</button>
    <button id="memoPopupClear">クリア</button>
    <button id="memoAiBtn">AI</button>
  </div>
  <div id="memoPopupEditor" contenteditable="true"></div>
</div>

<!-- AIパネル -->
<div id="aiPanel">
  <div id="aiPanelHeader">
    <span>AIアクション</span>
    <button id="aiPanelClose">✕</button>
  </div>

  <div id="aiActions">
    <button class="ai-action-btn" data-action="summarize">要約</button>
    <button class="ai-action-btn" data-action="organize">整理</button>
    <button class="ai-action-btn" data-action="expand">補足</button>
    <button class="ai-action-btn" data-action="question">質問生成</button>
  </div>

  <textarea id="aiCustomPrompt" placeholder="カスタムプロンプト"></textarea>
  <button id="aiCustomSend">送信</button>

  <div id="aiLoading">AI処理中…</div>
  <pre id="aiResult"></pre>

  <div id="aiResultActions">
    <button id="aiInsertBtn">挿入</button>
    <button id="aiReplaceBtn">置換</button>
  </div>
</div>

<!-- 音声モーダル -->
<div id="voiceModal">
  <div id="voiceHeader">
    <span>音声入力</span>
    <button id="voiceCancelBtn">✕</button>
  </div>
  <div id="voiceContent">
    <div id="voiceText"></div>
    <button id="voiceAnalyzeBtn">✨ AI で整理する</button>
    <button id="voiceStopBtn">停止</button>
  </div>
</div>

<!-- アイコン生成 -->
<div id="iconOverlay"></div>
<div id="iconModal">
  <button id="iconModalClose">✕</button>
  <canvas id="iconCanvas192" width="192" height="192"></canvas>
  <canvas id="iconCanvas512" width="512" height="512"></canvas>

  <input id="iconEmoji" placeholder="絵文字">
  <input id="iconBgColor" type="color">
  <input id="iconBgColor2" type="color">
  <input id="iconFgColor" type="color">
  <input id="iconFontSize" type="number">

  <button id="iconDl192">192px 保存</button>
  <button id="iconDl512">512px 保存</button>
</div>

<!-- メニュー -->
<div id="menuOverlay"></div>
<div id="menuSheet">
  <button id="exportBtn">エクスポート</button>
  <button id="importBtn">インポート</button>
  <button id="tagBridgeBtn">タグ同期</button>
  <button id="kanseiExportBtn">感性へ送信</button>
  <button id="iconGenBtn">アイコン生成</button>
  <button id="themeUrlBtn">テーマURL一覧</button>
</div>

<input type="file" id="importFileInput" hidden>

<!-- 追加ガイド -->
<div id="addGuide">
  <div id="addGuideContent">
    <h2 id="addGuideTitle"></h2>
    <p id="addGuideUrl"></p>
    <button id="addGuideClose">閉じる</button>
  </div>
</div>

<!-- Quick Dock -->
<div id="quickDock">
  <button id="fabBtn">＋</button>
  <button id="voiceFab">🎤</button>
  <button id="dockCam">📷</button>
  <button id="dockPhoto">🖼️</button>
  <button id="dockVideo">🎞️</button>
</div>

<!-- Flow-Mindへ送信 -->
<button id="sendBtn">Flow-Mindへ送信</button>

<!-- 送信モジュール -->
<script src="/shared/senders/flow-mind.js"></script>
<script src="/shared/senders/flowchart-lab.js"></script>
<script src="/shared/senders/creative-apps.js"></script>
<script src="/shared/senders/security-apps.js"></script>

<!-- main.js（ES module） -->
<script type="module" src="/main.js"></script>

</body>
</html>
